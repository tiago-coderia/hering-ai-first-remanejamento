version: '3.8'

services:
  hering-ai-engine:
    build: .
    container_name: hering_ai_engine
    ports:
      - '8000:8000'
      - '8501:8501'
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 &
             streamlit run app/ui.py --server.port 8501 --server.address 0.0.0.0"
